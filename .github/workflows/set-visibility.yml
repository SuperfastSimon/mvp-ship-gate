name: Set repo visibility

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "KEEP public = YieldLoop + mvp-ship-gate. Rest → private."
        required: true
        type: choice
        options:
          - dry-run
          - apply
        default: dry-run

permissions:
  contents: read

jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Policy
        run: |
          echo "KEEP public: YieldLoop, mvp-ship-gate"
          echo "All other owned repos → private"
          echo "Mode: ${{ inputs.mode }}"

      - name: Require GH_ADMIN_TOKEN
        env:
          TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret GH_ADMIN_TOKEN ontbreekt. Classic PAT met scope repo."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Run visibility policy
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
          OWNER: SuperfastSimon
          APPLY: ${{ inputs.mode == 'apply' && '1' || '0' }}
        run: |
          chmod +x scripts/set-repo-visibility.sh
          ./scripts/set-repo-visibility.sh
